name: Backup Supabase

# Copia nocturna de tablas + bucket erp-documents como artifact de GitHub (90 dias).
# Secrets del repo: SUPABASE_URL y SUPABASE_SERVICE_ROLE_KEY. Ver BACKUP.md.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *" # 01:00 Argentina (UTC-3)

concurrency: backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: node scripts/backup-supabase.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          if-no-files-found: error
