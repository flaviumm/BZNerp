<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizon ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Tokens del cotizador (wizard en src/cotizador) mapeados a las CSS vars del ERP:
      // heredan dark mode y el color de marca por organizacion sin tocar el wizard.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "rgb(var(--brand-rgb) / <alpha-value>)",
              "on-primary": "#ffffff",
              "primary-container": "var(--brand-tint)",
              surface: "var(--surface-alt)",
              "surface-container-lowest": "var(--surface-raised)",
              "surface-container-low": "var(--surface)",
              "surface-container": "var(--surface-alt)",
              "surface-container-high": "var(--border)",
              "on-surface": "var(--text)",
              "on-surface-variant": "var(--text-muted)",
              outline: "var(--border)",
              "outline-variant": "var(--brand-soft)",
              secondary: "var(--success)",
              "secondary-container": "var(--success-tint)",
              "on-secondary-container": "var(--success)",
              "inverse-surface": "var(--surface-inverse)",
              error: "rgb(var(--danger-rgb) / <alpha-value>)",
            },
          },
        },
      };
    </script>
    <style>
      /* Subset de Material Symbols (46 iconos) que usa el cotizador; self-hosteado para que no dependa de fonts.gstatic. */
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 300 600;
        font-display: block;
        src: url("/material-symbols-subset.woff2") format("woff2");
      }
      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        display: inline-block;
        white-space: nowrap;
        letter-spacing: normal;
        text-transform: none; /* uppercase/tracking del padre romperian la ligadura */
        direction: ltr;
        font-feature-settings: "liga";
        -webkit-font-smoothing: antialiased;
        font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 20;
        vertical-align: middle;
      }
      :root {
        color-scheme: light;
        --brand-rgb: 255 121 0;
        --danger-rgb: 180 35 24;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --surface: #fbfbf8;
        --surface-alt: #f5f5f3;
        --surface-raised: #ffffff;
        --surface-inverse: #18181b;
        --border: #ececf0;
        --track: var(--border);
        --text: #18181b;
        --text-muted: #71717a;
        --success: #0f766e;
        --warning: #b45309;
        --danger: #b42318;
        --success-tint: #f0fdf7;
        --success-tint-border: #cfe7dd;
        --warning-tint: #fff8e8;
        --warning-tint-border: #f4dfb6;
        --danger-tint: #fff5f5;
        --danger-tint-border: #f3d2d2;
        --brand: #ff7900;
        --brand-hover: #cc6100;
        --brand-tint: #fff2e5;
        --brand-soft: #ffbc80;
        --brand-shadow: rgba(255,121,0,0.22);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface: #18181b;
        --surface-alt: #0b0b0d;
        --surface-raised: #202023;
        --surface-inverse: #3f3f46;
        --border: #2f2f34;
        --text: #f4f4f5;
        --text-muted: #a1a1aa;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #f87171;
        --danger-rgb: 248 113 113;
        --success-tint: rgba(34,197,94,0.14);
        --success-tint-border: rgba(34,197,94,0.35);
        --warning-tint: rgba(245,158,11,0.14);
        --warning-tint-border: rgba(245,158,11,0.35);
        --danger-tint: rgba(248,113,113,0.14);
        --danger-tint-border: rgba(248,113,113,0.35);
        --brand-tint: #2e1d0d;
        --brand-soft: #7a4a1f;
      }

      body {
        margin: 0;
        background: var(--surface-alt);
        color: var(--text);
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bizon-theme");
          var theme = stored === "light" || stored === "dark" ? stored : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
